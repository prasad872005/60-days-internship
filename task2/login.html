<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="AuthUI Login Page">

    <title>Login | AuthUI</title>


    <!-- Bootstrap 5 CSS -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Bootstrap Icons -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">


    <!-- Google Font -->

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">


    <!-- Custom CSS -->

    <link rel="stylesheet" href="style.css">

</head>


<body class="auth-page">


    <!-- =========================
         NAVBAR
    ========================== -->

    <nav class="navbar navbar-dark custom-navbar">

        <div class="container">

            <a
                class="navbar-brand fw-bold"
                href="index.html">

                <i class="bi bi-shield-check"></i>

                AuthUI

            </a>


            <a
                href="index.html"
                class="btn btn-outline-light btn-sm">

                <i class="bi bi-house"></i>

                Home

            </a>

        </div>

    </nav>


    <!-- =========================
         LOGIN SECTION
    ========================== -->

    <main>

        <section class="auth-section">

            <div class="container">

                <div class="row justify-content-center">

                    <div class="col-12 col-sm-10 col-md-7 col-lg-5">


                        <!-- LOGIN CARD -->

                        <div class="auth-card">


                            <!-- ICON -->

                            <div class="auth-icon">

                                <i class="bi bi-person-circle"></i>

                            </div>


                            <!-- TITLE -->

                            <h1 class="text-center">
                                Welcome Back
                            </h1>


                            <p class="text-center text-muted">
                                Login to your AuthUI account
                            </p>


                            <!-- LOGIN FORM -->

                            <form id="loginForm"
                                  novalidate>


                                <!-- EMAIL -->

                                <div class="mb-3">

                                    <label
                                        for="loginEmail"
                                        class="form-label">

                                        Email Address

                                    </label>


                                    <div class="input-group">

                                        <span class="input-group-text">

                                            <i class="bi bi-envelope"></i>

                                        </span>


                                        <input
                                            type="email"
                                            class="form-control"
                                            id="loginEmail"
                                            name="email"
                                            placeholder="Enter your email"
                                            autocomplete="email"
                                            required>

                                    </div>


                                    <div
                                        id="loginEmailError"
                                        class="form-error">
                                    </div>

                                </div>


                                <!-- PASSWORD -->

                                <div class="mb-3">

                                    <label
                                        for="loginPassword"
                                        class="form-label">

                                        Password

                                    </label>


                                    <div class="input-group">

                                        <span class="input-group-text">

                                            <i class="bi bi-lock"></i>

                                        </span>


                                        <input
                                            type="password"
                                            class="form-control"
                                            id="loginPassword"
                                            name="password"
                                            placeholder="Enter your password"
                                            autocomplete="current-password"
                                            required>


                                        <!-- SHOW / HIDE -->

                                        <button
                                            type="button"
                                            class="btn btn-outline-secondary"
                                            id="toggleLoginPassword">

                                            <i
                                                class="bi bi-eye"
                                                id="loginPasswordIcon">
                                            </i>

                                        </button>

                                    </div>


                                    <div
                                        id="loginPasswordError"
                                        class="form-error">
                                    </div>

                                </div>


                                <!-- REMEMBER ME -->

                                <div
                                    class="d-flex justify-content-between align-items-center mb-4">

                                    <div class="form-check">

                                        <input
                                            class="form-check-input"
                                            type="checkbox"
                                            id="rememberMe">

                                        <label
                                            class="form-check-label"
                                            for="rememberMe">

                                            Remember me

                                        </label>

                                    </div>


                                    <a
                                        href="#"
                                        class="forgot-link">

                                        Forgot Password?

                                    </a>

                                </div>


                                <!-- LOGIN BUTTON -->

                                <button
                                    type="submit"
                                    class="btn btn-primary w-100 login-btn">

                                    <i class="bi bi-box-arrow-in-right"></i>

                                    Login

                                </button>


                                <!-- FORM MESSAGE -->

                                <div
                                    id="loginMessage"
                                    class="form-message text-center">
                                </div>


                            </form>


                            <!-- REGISTER LINK -->

                            <div class="text-center mt-4">

                                <p class="mb-0">

                                    Don't have an account?

                                    <a
                                        href="register.html"
                                        class="register-link">

                                        Create Account

                                    </a>

                                </p>

                            </div>


                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="custom-footer">

        <div class="container text-center">

            <p class="mb-0">

                © 2026 AuthUI | Task 2

            </p>

        </div>

    </footer>


    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- Custom JS -->

    <script src="script.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="AuthUI responsive login page built with HTML, CSS, JavaScript and Bootstrap 5">

    <meta name="author" content="Prasad Gadale">

    <title>Login | AuthUI</title>


    <!-- Bootstrap 5 CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">


    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">


    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- =====================================================
         NAVBAR
    ====================================================== -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">

        <div class="container">

            <a class="navbar-brand fw-bold" href="index.html">
                <i class="bi bi-shield-lock-fill"></i>
                AuthUI
            </a>


            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu"
                aria-controls="navbarMenu"
                aria-expanded="false"
                aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>

            </button>


            <div class="collapse navbar-collapse" id="navbarMenu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">

                        <a class="nav-link" href="index.html">
                            Home
                        </a>

                    </li>


                    <li class="nav-item">

                        <a class="nav-link active" href="login.html">
                            Login
                        </a>

                    </li>


                    <li class="nav-item">

                        <a class="nav-link" href="register.html">
                            Register
                        </a>

                    </li>

                </ul>

            </div>

        </div>

    </nav>



    <!-- =====================================================
         LOGIN SECTION
    ====================================================== -->

    <main>

        <section class="auth-section py-5">

            <div class="container">

                <div class="row justify-content-center align-items-center">


                    <!-- Login Card -->

                    <div class="col-12 col-sm-10 col-md-8 col-lg-5">

                        <div class="card auth-card border-0 shadow-lg">


                            <div class="card-body p-4 p-md-5">


                                <!-- Icon -->

                                <div class="text-center mb-4">

                                    <div class="auth-icon">

                                        <i class="bi bi-person-circle"></i>

                                    </div>


                                    <h1 class="h3 fw-bold mt-3">
                                        Welcome Back
                                    </h1>


                                    <p class="text-muted mb-0">
                                        Login to your AuthUI account
                                    </p>

                                </div>



                                <!-- Login Form -->

                                <form id="loginForm" novalidate>


                                    <!-- Email -->

                                    <div class="mb-3">

                                        <label
                                            for="loginEmail"
                                            class="form-label fw-semibold">

                                            Email Address

                                        </label>


                                        <div class="input-group">

                                            <span class="input-group-text">

                                                <i class="bi bi-envelope"></i>

                                            </span>


                                            <input
                                                type="email"
                                                class="form-control"
                                                id="loginEmail"
                                                name="email"
                                                placeholder="Enter your email"
                                                autocomplete="email"
                                                required>

                                        </div>


                                        <div
                                            id="loginEmailError"
                                            class="text-danger small mt-1">
                                        </div>

                                    </div>



                                    <!-- Password -->

                                    <div class="mb-3">

                                        <label
                                            for="loginPassword"
                                            class="form-label fw-semibold">

                                            Password

                                        </label>


                                        <div class="input-group">

                                            <span class="input-group-text">

                                                <i class="bi bi-lock"></i>

                                            </span>


                                            <input
                                                type="password"
                                                class="form-control"
                                                id="loginPassword"
                                                name="password"
                                                placeholder="Enter your password"
                                                autocomplete="current-password"
                                                required>


                                            <button
                                                type="button"
                                                class="btn btn-outline-secondary"
                                                id="toggleLoginPassword"
                                                aria-label="Show password">

                                                <i
                                                    class="bi bi-eye"
                                                    id="loginEyeIcon">
                                                </i>

                                            </button>

                                        </div>


                                        <div
                                            id="loginPasswordError"
                                            class="text-danger small mt-1">
                                        </div>

                                    </div>



                                    <!-- Remember Me / Forgot Password -->

                                    <div
                                        class="d-flex justify-content-between align-items-center mb-4">

                                        <div class="form-check">

                                            <input
                                                class="form-check-input"
                                                type="checkbox"
                                                id="rememberMe">

                                            <label
                                                class="form-check-label"
                                                for="rememberMe">

                                                Remember me

                                            </label>

                                        </div>


                                        <a href="#"
                                           class="text-primary text-decoration-none">

                                            Forgot password?

                                        </a>

                                    </div>



                                    <!-- Login Button -->

                                    <button
                                        type="submit"
                                        class="btn btn-primary w-100 py-2 fw-semibold">

                                        <i class="bi bi-box-arrow-in-right me-2"></i>

                                        Login

                                    </button>


                                    <!-- Success Message -->

                                    <div
                                        id="loginSuccess"
                                        class="alert alert-success mt-3 d-none"
                                        role="alert">

                                        <i class="bi bi-check-circle me-2"></i>

                                        Login successful!

                                    </div>


                                </form>



                                <!-- Register Link -->

                                <div class="text-center mt-4">

                                    <p class="mb-0 text-muted">

                                        Don't have an account?

                                        <a
                                            href="register.html"
                                            class="text-primary fw-semibold text-decoration-none">

                                            Create Account

                                        </a>

                                    </p>

                                </div>


                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>



    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="bg-dark text-white text-center py-4">

        <div class="container">

            <h5 class="fw-bold">
                AuthUI
            </h5>

            <p class="mb-2 text-white-50">
                Responsive Authentication Interface
            </p>


            <div>

                <a
                    href="https://github.com/prasad872005"
                    target="_blank"
                    class="text-white me-3">

                    <i class="bi bi-github"></i>

                    GitHub

                </a>


                <a
                    href="#"
                    class="text-white">

                    <i class="bi bi-linkedin"></i>

                    LinkedIn

                </a>

            </div>


            <hr class="border-secondary my-3">


            <small class="text-white-50">

                © 2026 Prasad Gadale. All Rights Reserved.

            </small>

        </div>

    </footer>



    <!-- Bootstrap JavaScript -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- Custom JavaScript -->

    <script src="script.js"></script>


</body>

</html>

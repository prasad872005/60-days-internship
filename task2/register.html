<!-- ================================
     REGISTRATION SECTION
================================ -->

<main>

<section class="auth-section">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">


                <div class="auth-card">


                    <!-- ICON -->

                    <div class="auth-icon">

                        <i class="bi bi-person-plus-fill"></i>

                    </div>


                    <!-- TITLE -->

                    <h1 class="auth-title">

                        Create Account

                    </h1>


                    <p class="auth-subtitle">

                        Register to get started

                    </p>


                    <!-- FORM -->

                    <form id="registerForm"
                          novalidate>


                        <!-- FULL NAME -->

                        <div class="mb-3">

                            <label for="registerName"
                                   class="form-label">

                                Full Name

                            </label>

                            <div class="input-group">

                                <span class="input-group-text">

                                    <i class="bi bi-person"></i>

                                </span>

                                <input type="text"
                                       class="form-control"
                                       id="registerName"
                                       name="name"
                                       placeholder="Enter your full name"
                                       minlength="3"
                                       required>

                            </div>

                            <small id="registerNameError"
                                   class="form-error">
                            </small>

                        </div>



                        <!-- EMAIL -->

                        <div class="mb-3">

                            <label for="registerEmail"
                                   class="form-label">

                                Email Address

                            </label>

                            <div class="input-group">

                                <span class="input-group-text">

                                    <i class="bi bi-envelope"></i>

                                </span>

                                <input type="email"
                                       class="form-control"
                                       id="registerEmail"
                                       name="email"
                                       placeholder="Enter your email"
                                       required>

                            </div>

                            <small id="registerEmailError"
                                   class="form-error">
                            </small>

                        </div>



                        <!-- PASSWORD -->

                        <div class="mb-3">

                            <label for="registerPassword"
                                   class="form-label">

                                Password

                            </label>

                            <div class="input-group">

                                <span class="input-group-text">

                                    <i class="bi bi-lock"></i>

                                </span>

                                <input type="password"
                                       class="form-control"
                                       id="registerPassword"
                                       name="password"
                                       placeholder="Create a password"
                                       minlength="6"
                                       required>

                                <button type="button"
                                        class="btn password-toggle"
                                        id="toggleRegisterPassword">

                                    <i class="bi bi-eye"></i>

                                </button>

                            </div>

                            <small id="registerPasswordError"
                                   class="form-error">
                            </small>

                        </div>



                        <!-- CONFIRM PASSWORD -->

                        <div class="mb-3">

                            <label for="confirmPassword"
                                   class="form-label">

                                Confirm Password

                            </label>

                            <div class="input-group">

                                <span class="input-group-text">

                                    <i class="bi bi-shield-lock"></i>

                                </span>

                                <input type="password"
                                       class="form-control"
                                       id="confirmPassword"
                                       name="confirmPassword"
                                       placeholder="Confirm your password"
                                       required>

                                <button type="button"
                                        class="btn password-toggle"
                                        id="toggleConfirmPassword">

                                    <i class="bi bi-eye"></i>

                                </button>

                            </div>

                            <small id="confirmPasswordError"
                                   class="form-error">
                            </small>

                        </div>



                        <!-- TERMS -->

                        <div class="form-check mb-4">

                            <input class="form-check-input"
                                   type="checkbox"
                                   id="terms"
                                   required>

                            <label class="form-check-label"
                                   for="terms">

                                I agree to the Terms and Conditions

                            </label>

                        </div>



                        <!-- REGISTER BUTTON -->

                        <button type="submit"
                                class="btn btn-primary custom-btn w-100">

                            <i class="bi bi-person-plus me-2"></i>

                            Create Account

                        </button>


                        <!-- SUCCESS MESSAGE -->

                        <div id="registerSuccess"
                             class="success-message mt-3">
                        </div>


                    </form>


                    <!-- LOGIN LINK -->

                    <p class="text-center mt-4 mb-0">

                        Already have an account?

                        <a href="login.html"
                           class="auth-link">

                            Login here

                        </a>

                    </p>


                </div>

            </div>

        </div>

    </div>

</section>
